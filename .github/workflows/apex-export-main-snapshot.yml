name: APEX Export Main Snapshot

on:
  push:
    paths:
      - '.github/workflows/apex-export-main-snapshot.yml'

permissions:
  contents: read

jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - name: Prepare tracked source snapshot
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/apex-main
          git ls-files -z | tar --null -T - -cf /tmp/apex-main.tar
          sha256sum /tmp/apex-main.tar | tee /tmp/apex-main.tar.sha256
      - name: Upload snapshot
        uses: actions/upload-artifact@v4
        with:
          name: apex-main-tracked-snapshot
          path: |
            /tmp/apex-main.tar
            /tmp/apex-main.tar.sha256
          compression-level: 0
          retention-days: 1

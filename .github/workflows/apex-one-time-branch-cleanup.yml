name: APEX One-time Branch Cleanup

on:
  push:
    paths:
      - '.github/workflows/apex-one-time-branch-cleanup.yml'

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - name: Delete stale branches and keep main only
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          branches=(
            'chore/v1.0.68-windows-verification'
            'remove-trading-lab-preview-fabrication'
            'dependabot/github_actions/actions/dependency-review-action-5'
            'dependabot/github_actions/actions/setup-node-7'
            'dependabot/github_actions/actions/setup-python-7'
            'dependabot/github_actions/actions/upload-artifact-7'
            'dependabot/npm_and_yarn/lucide-react-1.31.0'
            'dependabot/npm_and_yarn/types/node-26.2.0'
          )

          for branch in "${branches[@]}"; do
            echo "Deleting refs/heads/${branch}"
            gh api --method DELETE "repos/${GH_REPO}/git/refs/heads/${branch}"
          done

          echo 'Remaining branches:'
          gh api "repos/${GH_REPO}/branches?per_page=100" --jq '.[].name'

components:
  responses:
    InvalidRequest:
      description: Input failed finite, enum, range, shape, or workload validation.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
  schemas:
    ErrorEnvelope:
      type: object
      additionalProperties: false
      required:
      - ok
      - error
      properties:
        ok:
          const: false
        error:
          type: object
          additionalProperties: false
          required:
          - code
          - message
          - requestId
          - retryable
          - issues
          properties:
            code:
              type: string
            message:
              type: string
            requestId:
              type:
              - string
              - 'null'
            retryable:
              type: boolean
            issues:
              type: array
              items:
                type: object
                required:
                - field
                - code
                - message
                properties:
                  field:
                    type: string
                  code:
                    type: string
                  message:
                    type: string

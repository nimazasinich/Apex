      summary: Persist a bounded batch of canonical scanner decisions/outcome patches.
      x-apex-mutation-guard: same-origin + deployment-profile operator authentication; TLS required in production
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: true
      responses:
        '200':
          description: Batch persisted
        '422':
          description: Invalid decision-memory payload
  /api/decision-memory/export:
    get:
      operationId: exportDecisionMemory
      summary: Export canonical decision-memory data for offline validation/training gates without imputing labels.
      responses:
        '200':

  /api/decision-memory/status:
    get:
      operationId: getDecisionMemoryStatus
      summary: Read decision-memory durability/export/outcome-resolution status.
      responses:
        '200':
          description: Decision-memory status returned
  /api/execution/readiness:
    get:
      operationId: getExecutionReadiness
      summary: Read server-owned execution capability truth across manual Live, validation and testnet namespaces.
      description: Readiness is descriptive and never authorizes an order. Autonomous execution remains unavailable.
      responses:
        '200':
          description: Capability/readiness snapshot returned
  /api/execution/testnet/account:
    get:
      operationId: getTestnetAccount
      summary: Read KuCoin Futures testnet account evidence only when the approved testnet adapter is configured.
      responses:
        '200':
          description: Testnet account returned
        '503':
          description: Testnet unavailable or endpoint not approved
  /api/execution/testnet/orders:
    get:
      operationId: listTestnetOrders
      summary: Read durable testnet order/reconciliation records.
      responses:
        '200':
          description: Testnet order records returned
        '503':
          description: Testnet store unavailable
    post:
      operationId: submitTestnetOrder
      summary: Submit a manually confirmed Risk-Governor-approved order to the verified testnet adapter.
      description: Testnet endpoint approval is deny-by-default; arbitrary operator hostnames are not accepted.
      x-apex-mutation-guard: same-origin + deployment-profile operator authentication; TLS required in production
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: true
      responses:
        '201':
          description: Testnet order submitted or submission reconciled
        '409':
          description: Testnet prerequisites unavailable
        '422':
          description: Risk
          confirmation or order validation failed: null
        '503':
          description: Approved testnet adapter unavailable
  /api/execution/testnet/orders/{id}/cancel:
    post:
      operationId: cancelTestnetOrder
      summary: Cancel a known testnet order through the configured approved adapter.
      x-apex-mutation-guard: same-origin + deployment-profile operator authentication; TLS required in production
      parameters:
      - in: path
        name: id
        required: true
        schema:
          type: string
          minLength: 1
          maxLength: 160
      responses:
        '200':
          description: Cancellation/reconciliation result returned
        '404':
          description: Testnet order not found
        '503':
          description: Testnet unavailable

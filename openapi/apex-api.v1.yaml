    post:
      operationId: runMultiStrategyResearchBacktest
      summary: Run a bounded multi-strategy/multi-symbol research matrix and deterministic five-role paper council.
      description: Research-only. Each job must receive its exact requested closed-candle horizon (maximum 5,000); shorter
        histories fail that job. The response exposes requestedBars/candlesUsed/source provenance and cannot create exchange
        orders.
      responses:
        '200':
          description: Multi-strategy report
          deterministic paper council: null
          and short-lived server provenance receipt returned: null
        '422':
          description: Invalid/non-finite controls
          unsupported strategy context: null
          incomplete requested history: null
          or research failure: null
  /api/strategies/paper-multi-trade/size:
    post:
      operationId: sizePaperMultiTradePositions
      summary: Convert an exact server-issued council paper plan into bounded paper quantities from explicit entry/stop prices.
      description: Paper-only. The submitted plan set must match a short-lived server-side council receipt and canonical plan
        fingerprint. No exchange client or order submission is used; Risk Governor approval and explicit confirmation remain
        mandatory for any future execution path.
      responses:
        '200':
          description: Provenance-bound paper-only quantity and risk sizing report returned
        '422':
          description: Missing/expired council receipt

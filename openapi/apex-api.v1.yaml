  /api/execution/validation/orders:
    post:
      operationId: submitValidationOrder
      summary: Submit an explicitly confirmed order only to the configured validation environment.
      description: Does not weaken live execution controls. Requires server-side validation credentials/store, explicit confirmation
        and existing mutation security policy.
      x-apex-mutation-guard: same-origin + deployment-profile operator authentication; TLS required in production
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: true
      responses:
        '201':
          description: Validation order submitted
        '409':
          description: Validation environment not configured or not ready
        '422':
          description: Confirmation or order validation failed
        '503':
          description: Validation dependency unavailable
  /api/execution/validation/readiness:
    get:
      operationId: getValidationExecutionReadiness
      summary: Read validation-environment credentials/store readiness and safety state.
      responses:
        '200':
          description: Validation readiness returned
  /api/external-sources/config:
    post:
      operationId: updateExternalSourceConfig
      summary: Persist validated operator provider configuration to the private runtime-data location.
      description: Secret values are write-only and never returned; persistence is outside the repository root.
      x-apex-mutation-guard: same-origin + deployment-profile operator authentication; TLS required in production
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: true
              description: Provider settings are validated and secret fields are redacted from responses/logs.
      responses:
        '200':
          description: Configuration persisted with secret-redacted public state
        '422':
          description: Configuration validation failed
  /api/external-sources/config/defaults:

openapi: 3.1.0
info:
  title: APEX Same-Origin API
  version: 1.0.56
  description: Incremental contract for compute and mutation routes. Market read routes remain documented as they are migrated.
servers:
- url: /
paths:
  /api/account/connect:
    post:
      operationId: connectExchangeAccount
      summary: Verify exchange credentials and create a short-lived server-held live account session.
      description: Same-origin mutation. Credentials are retained only server-side and are never returned. In production deployment
        profile, the global mutation policy also requires operator authentication and TLS.
      x-apex-mutation-guard: same-origin + deployment-profile operator authentication; TLS required in production
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required:
              - apiKey
              - apiSecret
              - apiPassphrase
              properties:
                apiKey:
                  type: string
                  minLength: 1
                  maxLength: 256
                  writeOnly: true
                apiSecret:
                  type: string
                  minLength: 1
                  maxLength: 512
                  writeOnly: true
                apiPassphrase:
                  type: string
                  minLength: 1
                  maxLength: 512
                  writeOnly: true
                apiKeyVersion:
                  type: string
                  maxLength: 16
      responses:
        '200':
          description: Exchange session verified; public connection state and account snapshot returned
        '401':
          description: Exchange authentication failed
        '422':
          description: Credential or connection request validation failed
        '502':
          description: Exchange request failed
  /api/account/connection:
    get:
      operationId: getAccountConnection
      summary: Read public Demo/Live account connection state without exposing credentials.
      responses:
        '200':
          description: Public connection state returned
    delete:
      operationId: disconnectExchangeAccount
      summary: Destroy the live exchange session and return the workspace to Demo mode.
      x-apex-mutation-guard: same-origin + deployment-profile operator authentication; TLS required in production
      responses:
        '200':
          description: Live session destroyed and Demo snapshot returned
  /api/account/demo/reset:
    post:
      operationId: resetDemoAccount
      summary: Reset the server-owned Demo account with bounded optional starting values.
      x-apex-mutation-guard: same-origin + deployment-profile operator authentication; TLS required in production
      requestBody:
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                startingBalanceUsd:
                  type: number
                  exclusiveMinimum: 0
                maxOrderNotionalUsd:
                  type: number
                  exclusiveMinimum: 0
      responses:
        '200':
          description: Demo account reset and snapshot returned
  /api/account/mode:
    post:
      operationId: setAccountMode
      summary: Switch the workspace between Demo and an already verified Live session.
      x-apex-mutation-guard: same-origin + deployment-profile operator authentication; TLS required in production
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required:
              - mode
              properties:
                mode:
                  type: string
                  enum:
                  - demo
                  - live
                startingBalanceUsd:
                  type: number
                  exclusiveMinimum: 0
                maxOrderNotionalUsd:
                  type: number
                  exclusiveMinimum: 0
      responses:
        '200':
          description: Mode switched and current snapshot returned
        '409':
          description: Live mode requested without a verified live connection
        '422':
          description: Invalid account mode
  /api/account/orders:
    post:
      operationId: submitAccountOrder
      summary: Submit an explicitly confirmed server-issued Demo or Live order preview.
      description: Live submission remains manual, Risk-Governor-bound and idempotency/reconciliation protected. Autonomous
        execution is not exposed by this route.
      x-apex-mutation-guard: same-origin + deployment-profile operator authentication; TLS required in production
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required:
              - previewId
              - confirmation
              properties:
                previewId:
                  type: string
                  minLength: 1
                  maxLength: 160
                confirmation:
                  type: string
                  minLength: 1
                  maxLength: 160
      responses:
        '201':
          description: Confirmed preview submitted
        '202':
          description: Submission state uncertain; reconciliation required
        '401':
          description: Live exchange session required
        '403':
          description: Execution not armed
        '410':
          description: Preview expired
        '422':
          description: Explicit confirmation
          risk: null
          or order validation failed: null
        '502':
          description: Exchange submission failed
  /api/account/orders/preview:
    post:
      operationId: previewAccountOrder
      summary: Validate and risk-check a Demo or manually armed Live order before submission.
      description: Preview only; cannot submit an exchange order. Live preview requires a verified session and server-side
        execution arming.
      x-apex-mutation-guard: same-origin + deployment-profile operator authentication; TLS required in production
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              description: Order draft validated by the server order/trade-plan validators; non-finite and unsupported values
                are rejected.
              additionalProperties: true
      responses:
        '200':
          description: Server-owned preview returned
        '401':
          description: Live exchange session required
        '403':
          description: Live execution is not armed
        '422':
          description: Order
          trade-plan: null
          exchange-rule: null
          or Risk Governor validation failed: null
        '502':
          description: Required exchange data unavailable
  /api/account/orders/{id}/cancel:
    post:
      operationId: cancelAccountOrder
      summary: Cancel a Demo order or explicitly armed Live exchange order.
      x-apex-mutation-guard: same-origin + deployment-profile operator authentication; TLS required in production
      parameters:
      - in: path
        name: id
        required: true
        schema:
          type: string
          pattern: ^[A-Za-z0-9_-]{4,128}$
      responses:
        '200':
          description: Cancellation accepted
        '401':
          description: Live exchange session required
        '403':
          description: Execution not armed
        '422':
          description: Invalid order identifier or cancellation state
        '502':
          description: Exchange cancellation failed
  /api/account/portfolio:
    get:
      operationId: getAccountPortfolio
      summary: Read the authoritative Demo or connected Live account snapshot.
      responses:
        '200':
          description: Current portfolio snapshot returned
        '401':
          description: Live mode selected without a live exchange session
        '502':
          description: Live portfolio synchronization failed
  /api/account/workspace:
    get:
      operationId: getAccountWorkspace
      summary: Read normalized account workspace data and derived server-side insights.
      responses:
        '200':
          description: Workspace snapshot and insights returned
        '401':
          description: Live mode selected without a live exchange session
        '502':
          description: Workspace synchronization failed
  /api/backtest/datasource/fetch:
    post:
      operationId: postBacktestDatasourceFetch
      tags:
      - Backtest
      summary: POST /api/backtest/datasource/fetch
      description: Backtesting support route using bounded, provenance-bearing data requests.
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              additionalProperties: true
      responses:
        '200':
          description: Request completed; inspect response payload for provider provenance and degraded-state details where
            applicable.
        '400':
          $ref: '#/components/responses/InvalidRequest'
        '503':
          description: Required provider or runtime capability unavailable.
  /api/backtest/datasource/status:
    get:

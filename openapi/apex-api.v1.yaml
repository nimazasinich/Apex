  /api/strategies/autopilot/cycle:
    post:
      operationId: runSmartAutopilotCycle
      summary: Run one bounded Smart Autopilot champion/challenger auto-tuning cycle across strategy, market, timeframe and
        direction contexts.
      description: Research/paper-only. Each context starts from its active profile, runs chronological optimization with
        untouched holdout, cost stress and neighbor stability, then requires a separate deterministic five-agent promotion
        council. Approved revisions are re-tested through the existing multi-strategy research and five-role paper council.
        No exchange order can be created or authorized.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                cycleIndex:
                  type: integer
                  minimum: 0
                  maximum: 1000000
                  default: 0
                symbol:
                  type: string
                  pattern: ^[A-Z0-9_-]{2,32}$
                  default: BTC-USDT
                symbols:
                  type: array
                  maxItems: 6
                  items:
                    type: string
                    pattern: ^[A-Z0-9_-]{2,32}$
                preferredInterval:
                  type: string
                  enum:
                  - 5m
                  - 15m
                  - 1h
                  - 4h
                  - 1d
                  default: 1h
                maxContexts:
                  type: integer
                  minimum: 1
                  maximum: 8
                  default: 6
                bars:
                  type: integer
                  minimum: 1000
                  maximum: 5000
                  default: 3000
                maxHoldBars:
                  type: integer
                  minimum: 1
                  maximum: 240
                  default: 72
                optimizerConcurrency:
                  type: integer
                  minimum: 1
                  maximum: 3
                  default: 2
                coarseCandidates:
                  type: integer
                  minimum: 8
                  maximum: 48
                  default: 20
                refinementCandidates:
                  type: integer
                  minimum: 0
                  maximum: 24
                  default: 8
                commissionPct:
                  type: number
                  minimum: 0
                  maximum: 5
                  default: 0.04
                slippagePct:
                  type: number
                  minimum: 0
                  maximum: 5
                  default: 0.05
                fundingPct:
                  type: number
                  minimum: 0
                  maximum: 5
                  default: 0.01
                paperCapitalUsd:
                  type: number
                  minimum: 100
                  maximum: 1000000000
                  default: 100000
                portfolioRiskPct:
                  type: number
                  minimum: 0.05
                  maximum: 5
                  default: 1
                maxDirectionalWeight:
                  type: number
                  minimum: 0.1
                  maximum: 1
                  default: 0.7
      responses:
        '200':
          description: Optimization evidence
          auto-promotion decisions: null
          multi-strategy research and paper council output returned: null
        '409':
          description: No executable strategy contexts are available
        '422':
          description: Invalid or out-of-range bounded controls
        '429':
          description: Compute-heavy route rate limit exceeded
  /api/strategies/autopilot/status:
    get:
      operationId: getSmartAutopilotStatus
      summary: Read the latest Smart Autopilot research cycle and explicit non-execution safety state.
      description: Read-only. Autopilot scheduling is explicit opt-in: the normal client path starts it through the control route, while
        the optional server scheduler requires the explicit APEX_AUTOPILOT_SCHEDULER environment setting. Neither mode enables a
        live-trading loop or grants exchange-order authority.
      responses:
        '200':
          description: Latest cycle metadata and safety state returned
  /api/strategies/autopilot/control:
    post:
      operationId: controlSmartAutopilot
      summary: Start or stop the bounded Smart Autopilot research controller.
      description: Research/paper-only control. START arms the explicit client or configured server scheduler; STOP disarms it.
        Neither action grants execution authority, bypasses the Risk Governor, or submits an exchange order.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required:
                - action
              properties:
                action:
                  type: string
                  enum:
                    - START
                    - STOP
      responses:
        '200':
          description: Controller and scheduler state returned with explicit non-execution safety state
        '422':
          description: Action must be START or STOP
